<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Làm bài thi</title>
  <meta name="description" content="Bấm vào để làm bài thi trắc nghiệm trực tuyến.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="📝 Mời bạn làm bài thi trắc nghiệm">
  <meta property="og:description" content="Bấm vào để làm bài ngay, không cần đăng nhập.">
  <meta property="og:image" content="https://vuong7720.github.io/quiz-site/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2f6fed">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="quiz.css">
  <script src="theme.js"></script>
  <script src="common.js"></script>
  <script src="crypto.js"></script>
  <script src="quiz-engine.js"></script>
  <script src="history.js"></script>
</head>
<body class="play">
  <div class="playbar">
    <a class="btn small" id="backBtn" href="index.html" title="Về danh sách bài thi">←<span class="lbl" id="backLbl"> Danh sách</span></a>
    <div class="play-title" id="title">Đang tải…</div>
    <div class="actions">
      <a class="btn small" id="nextBtn" hidden title="Làm đề tiếp theo trong bộ"><span class="lbl">Đề tiếp </span>→</a>
      <button class="btn small" id="copyBtn" title="Copy link bài thi">🔗<span class="lbl"> Copy link</span></button>
      <button class="btn small" id="fsBtn" title="Toàn màn hình">⛶<span class="lbl"> Toàn màn hình</span></button>
      <button class="btn small icon" data-theme-toggle></button>
    </div>
  </div>

  <!-- Bài thi chạy trong iframe bị cô lập: không đọc được dữ liệu/token của trang -->
  <iframe id="frame" class="play-frame" hidden
          sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"
          allow="fullscreen; clipboard-write"></iframe>
  <!-- Bài dạng dữ liệu: chạy bằng trình làm bài của trang (nội dung luôn được escape) -->
  <main id="quizRoot" class="play-quiz" hidden></main>
  <div class="lock-wrap" id="lockBox" hidden>
    <form class="card lock-card" id="lockForm">
      <div class="lock-icon">🔒</div>
      <h2 id="lockTitle">Bài thi được bảo vệ</h2>
      <p class="hint">Nhập mật khẩu để vào làm bài.</p>
      <input id="pw" type="password" placeholder="Mật khẩu" autocomplete="off" required>
      <div id="pwError" class="lock-error" hidden>Sai mật khẩu, vui lòng thử lại.</div>
      <button class="btn primary" id="pwBtn" type="submit">Vào làm bài</button>
    </form>
  </div>
  <div id="notfound" class="empty" hidden>
    <span class="big">😕</span>Không tìm thấy bài thi này.<br><br>
    <a class="btn primary" href="index.html">Về danh sách bài thi</a>
  </div>
  <div id="toast" class="toast"></div>

  <script>
    const slug = new URLSearchParams(location.search).get('e') || '';
    const $ = id => document.getElementById(id);

    function toast(msg) {
      $('toast').textContent = msg;
      $('toast').classList.add('show');
      clearTimeout(toast.t);
      toast.t = setTimeout(() => $('toast').classList.remove('show'), 1800);
    }
    function notFound() {
      $('title').textContent = 'Không tìm thấy';
      $('frame').hidden = true;
      $('quizRoot').hidden = true;
      if (!navigator.onLine) {
        $('title').textContent = 'Không có mạng';
        $('notfound').firstElementChild.textContent = '📡';
        $('notfound').childNodes[1].textContent = 'Bạn đang offline và bài này chưa được lưu trên máy. Hãy kết nối mạng rồi mở lại.';
      }
      $('notfound').hidden = false;
    }

    const PW_KEY = 'quiz.pw.' + slug;
    let payload = null;
    let info = null;

    // Hiện nội dung bài (đã giải mã nếu có mật khẩu)
    function show(content) {
      if (info?.type === 'quiz') {
        const data = typeof content === 'string' ? JSON.parse(content) : content;
        let owner = false;
        try { owner = !!localStorage.getItem('quiz.owner'); } catch {}
        $('quizRoot').hidden = false;
        QuizEngine.mount($('quizRoot'), data, {
          icon: info.icon,
          getStats: () => QuizHistory.summary(slug),
          onFinish: r => QuizHistory.record(slug, info.title, r, r.review),
          autoReview: new URLSearchParams(location.search).get('review') === '1',
          onPrint: mode => QuizEngine.print(data, mode, { series: info.series, footer: location.origin + location.pathname + '?e=' + slug }),
          canPrintAnswers: owner, // chỉ máy của chủ trang mới in được bản có đáp án
        });
      } else {
        $('frame').srcdoc = content;
        $('frame').hidden = false;
      }
    }

    function savedPassword() {
      // Ưu tiên mật khẩu gắn trong link (#k=...), sau đó tới mật khẩu đã nhập trong tab này
      const fromLink = new URLSearchParams(location.hash.slice(1)).get('k');
      if (fromLink) history.replaceState(null, '', location.pathname + location.search);
      try { return fromLink || sessionStorage.getItem(PW_KEY); } catch { return fromLink; }
    }

    async function unlock(pw) {
      try {
        const content = await QuizCrypto.decrypt(payload, pw);
        try { sessionStorage.setItem(PW_KEY, pw); } catch {}
        $('lockBox').hidden = true;
        show(content);
        return true;
      } catch {
        try { sessionStorage.removeItem(PW_KEY); } catch {}
        return false;
      }
    }

    $('lockForm').onsubmit = async ev => {
      ev.preventDefault();
      $('pwBtn').disabled = true;
      $('pwBtn').textContent = 'Đang mở...';
      const ok = await unlock($('pw').value);
      $('pwBtn').disabled = false;
      $('pwBtn').textContent = 'Vào làm bài';
      $('pwError').hidden = ok;
      if (!ok) $('pw').select();
    };

    // Bài thuộc bộ đề: nút ← về trang bộ đề, nút "Đề tiếp →" sang đề kế tiếp
    function setupSeriesNav(list, info) {
      if (!info?.series) return;
      const s = QuizUtil.slugify(info.series);
      $('backBtn').href = `series.html?s=${s}`;
      $('backBtn').title = `Về bộ đề: ${info.series}`;
      $('backLbl').textContent = ' Bộ đề';
      const papers = list.filter(e => e.series === info.series).sort(QuizUtil.compareInSeries);
      const next = papers[papers.findIndex(e => e.slug === info.slug) + 1];
      if (next) {
        $('nextBtn').href = `play.html?e=${encodeURIComponent(next.slug)}&s=${s}`;
        $('nextBtn').title = `Đề tiếp: ${next.title}`;
        $('nextBtn').hidden = false;
      }
    }

    async function init() {
      if (!/^[a-z0-9-]+$/.test(slug)) return notFound();
      const list = await QuizUtil.loadExams();
      info = list.find(e => e.slug === slug) || null;
      const isQuiz = info?.type === 'quiz';
      const path = `exams/${slug}.${isQuiz ? 'json' : 'html'}`;
      const text = await fetch(path, { cache: 'no-store' }).then(r => r.ok ? r.text() : null).catch(() => null);
      if (text === null) return notFound();

      const title = info?.title || slug;
      setupSeriesNav(list, info);
      $('title').textContent = `${info?.icon ? info.icon + ' ' : ''}${title}`;
      document.title = title;

      if (isQuiz) {
        let data;
        try { data = JSON.parse(text); } catch { return notFound(); }
        payload = data.locked || null;
        if (!payload) return show(data);
      } else {
        payload = QuizCrypto.readLocked(text);
        if (!payload) {
          $('frame').src = path;
          $('frame').hidden = false;
          return;
        }
      }
      $('lockTitle').textContent = `🔒 ${title}`;
      const pw = savedPassword();
      if (pw && await unlock(pw)) return;
      $('lockBox').hidden = false;
      $('pw').focus();
    }

    $('copyBtn').onclick = async () => {
      // Không bao giờ copy kèm mật khẩu
      const link = location.origin + location.pathname + location.search;
      try {
        await navigator.clipboard.writeText(link);
        toast('Đã copy link bài thi');
      } catch {
        prompt('Copy link bài thi:', link);
      }
    };

    if (!document.fullscreenEnabled) $('fsBtn').hidden = true;
    $('fsBtn').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();

    init();
  </script>
</body>
</html>
