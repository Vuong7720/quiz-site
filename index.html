<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bài thi trắc nghiệm</title>
  <meta name="description" content="Kho bài thi trắc nghiệm trực tuyến — chọn bài và làm ngay, không cần đăng nhập.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="📝 Bài thi trắc nghiệm">
  <meta property="og:description" content="Kho bài thi trắc nghiệm trực tuyến — chọn bài và làm ngay, không cần đăng nhập.">
  <meta property="og:image" content="https://vuong7720.github.io/quiz-site/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
  <script src="common.js"></script>
</head>
<body>
  <div class="container">
    <section class="hero">
      <div>
        <h1>📝 Bài thi trắc nghiệm</h1>
        <p id="summary">Chọn một bài thi để bắt đầu.</p>
      </div>
      <div class="actions">
        <button class="btn ghost icon" data-theme-toggle></button>
        <a class="btn white" id="createBtn" href="create.html" hidden>+ Tạo bài thi</a>
      </div>
    </section>

    <div class="toolbar">
      <input id="search" class="search" type="search" placeholder="Tìm bài thi, bộ đề...">
      <div id="chips" class="chips"></div>
    </div>

    <div id="list" class="grid"></div>
    <div id="empty" class="empty" hidden></div>
  </div>

  <script>
    const { escapeHtml, accent, slugify } = QuizUtil;
    const listEl = document.getElementById('list');
    const emptyEl = document.getElementById('empty');
    const searchEl = document.getElementById('search');
    const chipsEl = document.getElementById('chips');
    let exams = [];
    let activeTopic = '';

    // Nút "Tạo bài thi" chỉ hiện trên máy đã lưu token (máy của chủ trang)
    try {
      if (localStorage.getItem('quiz.owner') || localStorage.getItem('quiz.token') || sessionStorage.getItem('quiz.token')) {
        document.getElementById('createBtn').hidden = false;
      }
    } catch {}

    const dateOf = e => e.createdAt ? new Date(e.createdAt).toLocaleDateString('vi-VN') : '';

    function renderChips() {
      const counts = {};
      exams.forEach(e => { if (e.topic) counts[e.topic] = (counts[e.topic] || 0) + 1; });
      const topics = Object.keys(counts).sort((a, b) => a.localeCompare(b, 'vi'));
      chipsEl.hidden = topics.length === 0;
      chipsEl.innerHTML = [['', 'Tất cả', exams.length], ...topics.map(t => [t, t, counts[t]])]
        .map(([value, label, n]) => `<button class="chip${value === activeTopic ? ' active' : ''}" data-topic="${escapeHtml(value)}">${escapeHtml(label)}<span class="count">${n}</span></button>`)
        .join('');
    }

    function examCard(e) {
      const badges = [
        e.topic && `<span class="badge topic">${escapeHtml(e.topic)}</span>`,
        e.questions && `<span class="badge">${escapeHtml(e.questions)} câu</span>`,
        e.minutes && `<span class="badge">⏱ ${escapeHtml(e.minutes)} phút</span>`,
        e.locked && `<span class="badge">🔒 Có mật khẩu</span>`,
        e.createdAt && `<span class="badge">${dateOf(e)}</span>`,
      ].filter(Boolean).join('');
      return `
        <a class="card exam-card" style="--accent:${accent(e.slug)}" href="play.html?e=${encodeURIComponent(e.slug)}">
          <div class="exam-head">
            <div class="exam-icon">${escapeHtml(e.icon || '📝')}</div>
            <div>
              <h3>${escapeHtml(e.title)}</h3>
              ${e.description ? `<p>${escapeHtml(e.description)}</p>` : ''}
            </div>
          </div>
          <div class="badges">${badges}</div>
        </a>`;
    }

    function seriesCard(name, items) {
      const sorted = [...items].sort(QuizUtil.compareInSeries);
      const topics = [...new Set(items.map(e => e.topic).filter(Boolean))];
      const latest = items.reduce((a, b) => ((b.createdAt || '') > (a.createdAt || '') ? b : a));
      const preview = sorted.slice(0, 3).map(e => escapeHtml(e.title)).join(' · ') + (sorted.length > 3 ? ' …' : '');
      const badges = [
        `<span class="badge topic">📚 ${items.length} đề</span>`,
        ...topics.slice(0, 2).map(t => `<span class="badge">${escapeHtml(t)}</span>`),
        items.some(e => e.locked) && `<span class="badge">🔒</span>`,
        latest.createdAt && `<span class="badge">Mới: ${dateOf(latest)}</span>`,
      ].filter(Boolean).join('');
      return `
        <a class="card exam-card series-card" style="--accent:${accent(name)}" href="series.html?s=${slugify(name)}">
          <div class="exam-head">
            <div class="exam-icon">📚</div>
            <div>
              <h3>${escapeHtml(name)}</h3>
              <p>${preview}</p>
            </div>
          </div>
          <div class="badges">${badges}</div>
        </a>`;
    }

    function render() {
      const q = searchEl.value.trim().toLowerCase();
      const matched = exams.filter(e =>
        (!activeTopic || e.topic === activeTopic) &&
        (!q || [e.title, e.description, e.topic, e.series].join(' ').toLowerCase().includes(q)));

      // Gom đề cùng bộ thành một thẻ, giữ thứ tự theo đề mới nhất
      const cards = [];
      const seen = new Set();
      matched.forEach(e => {
        if (!e.series) return cards.push(examCard(e));
        if (seen.has(e.series)) return;
        seen.add(e.series);
        cards.push(seriesCard(e.series, exams.filter(x => x.series === e.series)));
      });

      emptyEl.hidden = cards.length > 0;
      emptyEl.innerHTML = exams.length
        ? '<span class="big">🔍</span>Không tìm thấy bài thi phù hợp.'
        : '<span class="big">📭</span>Chưa có bài thi nào.';
      listEl.innerHTML = cards.join('');
    }

    chipsEl.addEventListener('click', ev => {
      const chip = ev.target.closest('.chip');
      if (!chip) return;
      activeTopic = chip.dataset.topic;
      renderChips();
      render();
    });
    searchEl.addEventListener('input', render);

    QuizUtil.loadExams().then(data => {
      exams = data.sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
      const nSeries = new Set(exams.map(e => e.series).filter(Boolean)).size;
      document.getElementById('summary').textContent = exams.length
        ? `${exams.length} bài thi${nSeries ? ` · ${nSeries} bộ đề` : ''} · chọn một bài để bắt đầu.`
        : 'Chưa có bài thi nào.';
      renderChips();
      render();
    });
  </script>
</body>
</html>
